<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="css/vanilla-image-zoom.css">
  <script src="js/vanilla-image-zoom.js"></script>
</head>
<body>
  <div class="container" style="max-width: 700px; margin: 40px auto; text-align: center;">
    <h1>vanilla-image-zoom Sample</h1>
    <p style="color: #555;">Click an image to zoom in. Click again or press Esc to close.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin-top: 32px;">
      <div>
        <img src="img/sample1.jpg" data-action="zoom" alt="Sample Image 1" style="max-width: 200px; width: 100%; box-shadow: 0 2px 8px #0002;">
        <div style="margin-top: 8px; font-size: 0.95em; color: #888;">Sample Image 1</div>
      </div>
      <div>
        <img src="img/sample2.jpg" data-action="zoom" alt="Sample Image 2" style="max-width: 200px; width: 100%; box-shadow: 0 2px 8px #0002;">
        <div style="margin-top: 8px; font-size: 0.95em; color: #888;">Sample Image 2</div>
      </div>
      <div>
        <img src="img/sample3.jpg" data-action="zoom" alt="Sample Image 3" style="max-width: 200px; width: 100%; box-shadow: 0 2px 8px #0002;">
        <div style="margin-top: 8px; font-size: 0.95em; color: #888;">Sample Image 3</div>
      </div>
    </div>
    <div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;">
      <div>
        <img src="img/sample-vertical1.jpg" data-action="zoom" alt="Sample Vertical Image 1" style="max-width: 250px; width: 100%; height: auto; box-shadow: 0 2px 12px #0002; display: block;">
        <div style="margin-top: 8px; font-size: 0.95em; color: #888; text-align: center;">Sample Vertical Image 1</div>
      </div>
      <div>
        <img src="img/sample-vertical2.jpg" data-action="zoom" alt="Sample Vertical Image 2" style="max-width: 250px; width: 100%; height: auto; box-shadow: 0 2px 12px #0002; display: block;">
        <div style="margin-top: 8px; font-size: 0.95em; color: #888; text-align: center;">Sample Vertical Image 2</div>
      </div>
    </div>
    <div style="margin-top: 40px; color: #aaa; font-size: 0.9em;">powered by <b>vanilla-image-zoom.js</b></div>
  </div>
</body>
</html>
